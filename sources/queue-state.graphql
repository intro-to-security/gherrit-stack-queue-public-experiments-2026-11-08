query QueueState($owner: String!, $repo: String!, $branch: String!) {
  repository(owner: $owner, name: $repo) {
    mergeQueue(branch: $branch) {
      id
      url
      entries(first: 100) {
        nodes {
          id
          position
          state
          enqueuedAt
          headCommit { oid }
          baseCommit { oid }
          pullRequest { id number headRefOid }
        }
        pageInfo { hasNextPage endCursor }
      }
    }
  }
}
